name: Re-author last commit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reauthor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and amend commit author
        run: |
          CURRENT_AUTHOR=$(git log -1 --pretty=format:'%ae')
          echo "Current author email: $CURRENT_AUTHOR"

          if [ "$CURRENT_AUTHOR" = "urbgodelivery@gmail.com" ]; then
            echo "✅ Commit already authored by urbgodelivey. Skipping."
            exit 0
          fi

          echo "🔄 Re-authoring commit..."
          git config user.name "urbgodelivey"
          git config user.email "urbgodelivery@gmail.com"
          git commit --amend --no-edit --author="urbgodelivey <urbgodelivery@gmail.com>"
          git push --force-with-lease
